name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /home/leighericksen/libs3d
          git pull origin main

      - name: Rebuild and restart containers
        run: |
          cd /home/leighericksen/libs3d
          docker compose up --build -d
          docker image prune -f
